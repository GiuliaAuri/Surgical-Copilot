  warmup_epochs: 5
  pretrained_weights_path: "weights/yolo_v8_baseline/best_fold{fold_idx}.pth"


# ==============================================================================
# UNET e tutte le varianti
# ==============================================================================
# BASELINE
unet:
  _target_: monai.networks.nets.UNet
  spatial_dims: 2
  in_channels: 3
  out_channels: 1
  channels: [32, 64, 128, 256, 512]
  strides: [2, 2, 2, 2]
  num_res_units: 2

# BASELINE + RESNET18
unet_resnet18:
  _target_: surgical_copilot.models.segmentation_smp.SMPUNet
  encoder_name: "resnet18"
  encoder_weights: "imagenet"
  use_imagenet_norm: True
  in_channels: 3
  classes: 1

# EARLY FUSION (4 Canali: RGB + Maschera t-1)
early_fusion_unet_resnet18:
  _target_: surgical_copilot.models.segmentation_smp.SMPUNet
  encoder_name: "resnet18"
  encoder_weights: "imagenet"
  use_imagenet_norm: True
  in_channels: 4 # <-- 3 RGB + 1 Maschera
  classes: 1
  is_temporal: true
  temporal_mode: "early_fusion"
  temporal_target_layer: "model.encoder.conv1.weight" # Copia i pesi da 3 a 4 canali

# LATE FUSION - NO WARM START (R-UNet addestrata da zero)
r_unet_resnet18_gru_scratch:
  _target_: surgical_copilot.models.segmentation_smp.RecurrentSMPUNet
  encoder_name: "resnet18"
  encoder_weights: "imagenet"
  use_imagenet_norm: True
  in_channels: 3
  classes: 1
  recurrent_type: "gru"
  bottleneck_dim: 512
  freeze_backbone: False # Senza warm-start, addestriamo tutto end-to-end subito
  is_temporal: true
  temporal_mode: "recurrent"
  warmup_epochs: 0
  # NOTA: Niente pretrained_weights_path, parte da zero

resnet18_unetr:
    _target_: monai.networks.nets.FlexibleUNETR
    in_channels: 3
    out_channels: 1
    backbone: "resnet18"
    pretrained: True       
    spatial_dims: 2

r_unet_resnet18_gru:
  _target_: surgical_copilot.models.segmentation_smp.RecurrentSMPUNet
  encoder_name: "resnet18"
  encoder_weights: "imagenet"
  use_imagenet_norm: True
  in_channels: 3
  classes: 1
  recurrent_type: "gru"
  bottleneck_dim: 512
  freeze_backbone: True
  is_temporal: true
  temporal_mode: "recurrent"
  temporal_target_layer: "model.encoder.conv1.weight"
  warmup_epochs: 5
  pretrained_weights_path: "weights/unet_resnet18/best_fold{fold_idx}.pth" # <-- Usa la Baseline

# LATE FUSION - NO WARM START con LSTM (addestrata da zero)
r_unet_resnet18_lstm_scratch:
  _target_: surgical_copilot.models.segmentation_smp.RecurrentSMPUNet
  encoder_name: "resnet18"
  encoder_weights: "imagenet"
  use_imagenet_norm: True
  in_channels: 3
  classes: 1
  recurrent_type: "lstm"
  bottleneck_dim: 512
  freeze_backbone: False
  is_temporal: true
  temporal_mode: "recurrent"
  warmup_epochs: 0

# LATE FUSION - WARM START con LSTM
r_unet_resnet18_lstm_warm:
  _target_: surgical_copilot.models.segmentation_smp.RecurrentSMPUNet
  encoder_name: "resnet18"
  encoder_weights: "imagenet"
  use_imagenet_norm: True
  in_channels: 3
  classes: 1
  recurrent_type: "lstm"
  bottleneck_dim: 512
  freeze_backbone: True
  is_temporal: true
  temporal_mode: "recurrent"
  temporal_target_layer: "model.encoder.conv1.weight"
  warmup_epochs: 5
  pretrained_weights_path: "weights/unet_resnet18/best_fold{fold_idx}.pth"