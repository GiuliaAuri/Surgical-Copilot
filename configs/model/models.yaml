    encoder_name: "resnet18"
    encoder_weights: "imagenet"
    in_channels: 3
    classes: 1
    recurrent_type: "lstm"
    bottleneck_dim: 512
    freeze_backbone: True
    warmup_epochs: 5
    pretrained_weights_path: "/work/cvcs2026/DeepLook/results/weights/SMPUNet/best_fold{fold_idx}.pth"

