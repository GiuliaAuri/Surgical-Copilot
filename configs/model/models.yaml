######################
# Late Fusion model
######################

yolo_late_fusion_gru:
  _target_: surgical_copilot.models.yolov8_seg.yolov8_seg_wrapper.YOLOLateFusionTemporal
  in_channels: 3
  num_classes: 1
  num_masks: 32
  recurrent_type: "gru"   
  temporal_mode: "late_fusion"     
  freeze_backbone: True
  warmup_epochs: 5
  temporal_target_layer: "yolo.backbone.stem.conv.weight"
  pretrained_weights_path: "results/best_YOLOv8Segmenter_fold{fold_idx}.pth"

yolo_late_fusion_lstm:
  _target_: surgical_copilot.models.yolov8_seg.yolov8_seg_wrapper.YOLOLateFusionTemporal
  in_channels: 3 
  num_classes: 1
  num_masks: 32
  recurrent_type: "lstm"     
  temporal_mode: "late_fusion"
  freeze_backbone: True
  warmup_epochs: 5
  temporal_target_layer: "yolo.backbone.stem.conv.weight"
  pretrained_weights_path: "results/best_YOLOv8Segmenter_fold{fold_idx}.pth"

r_unet_late_fusion_gru:
  _target_: surgical_copilot.models.Recurrent_U_Net.recurrent_u_net.RecurrentUNet
  spatial_dims: 2
  in_channels: 3
  out_channels: 1
  channels: [32, 64, 128, 256, 512]
  strides: [2, 2, 2, 2]
  recurrent_type: "gru"
  num_res_units: 2
  freeze_backbone: True
  temporal_mode: "late_fusion"
  warmup_epochs: 5
  pretrained_weights_path: "weights/Unet/best_fold0.pth"

r_unet_late_fusion_lstm:
  _target_: surgical_copilot.models.Recurrent_U_Net.recurrent_u_net.RecurrentUNet
  spatial_dims: 2
  in_channels: 3
  out_channels: 1
  channels: [32, 64, 128, 256, 512]
  strides: [2, 2, 2, 2]
  recurrent_type: "lstm"
  num_res_units: 2
  freeze_backbone: True
  temporal_mode: "late_fusion"
  warmup_epochs: 5
  pretrained_weights_path: "weights/Unet/best_fold0.pth"

# ==============================================================================
# MODELLI SMP CON ENCODER RESNET18 PRE-ADDESTRATO SU IMAGENET
# ==============================================================================

unet_resnet18:
  _target_: surgical_copilot.models.segmentation_smp.SMPUNet
  encoder_name: "resnet18"
  encoder_weights: "imagenet"
  in_channels: 3
  classes: 1
  temporal_mode: none

unet_plus_plus_resnet18:
  _target_: surgical_copilot.models.segmentation_smp.SMPUNetPlusPlus
  encoder_name: "resnet18"
  encoder_weights: "imagenet"
  in_channels: 3
  classes: 1
  temporal_mode: none

resnet18_unetr:
    _target_: monai.networks.nets.FlexibleUNETR ##!!!
    in_channels: 3
    out_channels: 1
    backbone: "resnet18"
    pretrained: True       
    spatial_dims: 2
    temporal_mode: none

r_unet_resnet18_late_fusion_gru:
  _target_: surgical_copilot.models.segmentation_smp.RecurrentSMPUNet
  encoder_name: "resnet18"
  encoder_weights: "imagenet"
  in_channels: 3
  classes: 1
  recurrent_type: "gru"
  bottleneck_dim: 512
  freeze_backbone: True
  temporal_mode: "late_fusion"
  #temporal_target_layer: "model.encoder.conv1.weight"
  warmup_epochs: 5
  pretrained_weights_path: "weights/unet_resnet18/best_fold{fold_idx}.pth"

r_unet_resnet18_late_fusion_lstm:
  _target_: surgical_copilot.models.segmentation_smp.RecurrentSMPUNet
  encoder_name: "resnet18"
  encoder_weights: "imagenet"
  in_channels: 3
  classes: 1
  recurrent_type: "lstm"
  bottleneck_dim: 512
  freeze_backbone: True
  temporal_mode: "late_fusion"
  #temporal_target_layer: "model.encoder.conv1.weight"
  warmup_epochs: 5
  pretrained_weights_path: "weights/unet_resnet18/best_fold{fold_idx}.pth"