unet:
  _target_: monai.networks.nets.UNet
  spatial_dims: 2
  in_channels: 3
  out_channels: 1
  channels: [32, 64, 128, 256, 512]
  strides: [2, 2, 2, 2]
  num_res_units: 2
  temporal_mode: none

unet_plus_plus:
  _target_: monai.networks.nets.BasicUNetPlusPlus
  spatial_dims: 2
  in_channels: 3
  out_channels: 1
  features: [32, 64, 128, 256, 512, 32]
  deep_supervision: False
  temporal_mode: none

