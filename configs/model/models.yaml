# ==============================================================================
# MODELLI BASELINE
# ==============================================================================
unet_plus_plus:
  _target_: monai.networks.nets.BasicUNetPlusPlus
  spatial_dims: 2
  in_channels: 3
  out_channels: 1
  features: [32, 64, 128, 256, 512, 32]
  deep_supervision: False

unet_plus_plus_resnet18:
  _target_: surgical_copilot.models.segmentation_smp.SMPUNetPlusPlus
  encoder_name: "resnet18"
  encoder_weights: "imagenet"
  use_imagenet_norm: True
  in_channels: 3
  classes: 1

#swin_unet:
#    _target_: surgical_copilot.models.vision_trasformer_swin.swin_unet.SwinUnet 
#    img_size: [640, 480]
#    in_chans: 3
#    num_classes: 1
#    window_size: 8
  
swin_unetr:
    _target_: monai.networks.nets.SwinUNETR
    img_size: [640, 480]
    in_channels: 3
    out_channels: 1
    feature_size: 48
    spatial_dims: 2 # generally SwinUNETR is used with 3D image. In this way we can manage 2D frame
    use_checkpoint: True

# ==============================================================================
# MODELLI YOLOv8 e le varianti
# ==============================================================================

# BASELINE 
yolo_v8_baseline:
  _target_: surgical_copilot.models.yolov8_seg.yolov8_seg_wrapper.CustomYOLOSemantic
  num_classes: 1
  num_masks: 32
  # default in_channels è 3

# ==============================================================================
#  MODELLI TEMPORALI
# ==============================================================================

#yolo_v8_seg_temporal:
#  _target_: surgical_copilot.models.yolov8_seg.yolov8_seg_wrapper.CustomYOLOSemantic
#  in_channels: 4   # 3 channels RGB + 1 mask t-1 channel
#  num_classes: 1
#  num_masks: 32
#  is_temporal: true
#  temporal_mode: "early_fusion"
#  temporal_target_layer: "yolo.backbone.stem.0.conv.weight"

yolo_early_fusion:
  _target_: surgical_copilot.models.yolov8_seg.yolov8_seg_wrapper.CustomYOLOSemantic
  in_channels: 4
  num_classes: 1
  num_masks: 32
  is_temporal: true
  temporal_mode: "early_fusion"
  temporal_target_layer: "yolo.backbone.stem.0.conv.weight"

# LATE FUSION YOLO - NO WARM START (Addestrato da zero)
yolo_v8_late_fusion_scratch:
  _target_: surgical_copilot.models.yolov8_seg.yolov8_seg_wrapper.YOLOLateFusionTemporal
  in_channels: 3
  num_classes: 1
  num_masks: 32
  recurrent_type: "gru"
  is_temporal: true            
  temporal_mode: "recurrent"     
  freeze_backbone: False
  warmup_epochs: 0

# LATE FUSION YOLO - WARM START (Usa i pesi della Baseline)
yolo_v8_late_fusion_warm:
  _target_: surgical_copilot.models.yolov8_seg.yolov8_seg_wrapper.YOLOLateFusionTemporal
  in_channels: 3 
  num_classes: 1
  num_masks: 32
  recurrent_type: "gru"
  is_temporal: true            
  temporal_mode: "recurrent"
  freeze_backbone: True
  temporal_target_layer: "yolo.backbone.stem.0.conv.weight"
  warmup_epochs: 5
  pretrained_weights_path: "weights/yolo_v8_baseline/best_fold{fold_idx}.pth"

