  architecture:
    _target_: src.surgical_copilot.models.Recurrent_U_Net.runet.RecurrentUNet
    spatial_dims: 2
    in_channels: 3
    out_channels: 1
    channels: [32, 64, 128, 256, 512]
    strides: [2, 2, 2, 2]
    recurrent_type: "lstm"
    num_res_units: 2
    recurrent_layers: 1  
    freeze_backbone: True
    warmup_epochs: 0
    pretrained_weights_path: None

  temporal_setting:
    temporal_mode: "late_fusion"
    temporal_target_layer: None

r_unet_late_fusion_gru_warmup_off:
  architecture:
    _target_: src.surgical_copilot.models.Recurrent_U_Net.runet.RecurrentUNet
    spatial_dims: 2
    in_channels: 3
