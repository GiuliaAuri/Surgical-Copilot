r_unet_gru:
  _target_: surgical_copilot.models.Recurrent_U_Net.recurrent_u_net.RecurrentUNet
  spatial_dims: 2
  in_channels: 3
  num_classes: 1
  num_masks: 32
  recurrent_type: "lstm"  
  is_temporal: true            
  temporal_mode: "recurrent"     
  freeze_backbone: False
  warmup_epochs: 0

# LATE FUSION YOLO - WARM START (LSTM con pesi della Baseline)
yolo_v8_late_fusion_lstm_warm:
  _target_: surgical_copilot.models.yolov8_seg.yolov8_seg_wrapper.YOLOLateFusionTemporal
  in_channels: 3
  num_classes: 1
