# U-NET

## BASELINE

unet:
  architecture:
    _target_: monai.networks.nets.UNet
    spatial_dims: 2
    in_channels: 3
    out_channels: 1
    channels: [32, 64, 128, 256, 512]
    strides: [2, 2, 2, 2]
    num_res_units: 2

  initialization:
    mode: scratch
    checkpoint_path: null
    freeze_backbone: false
    warmup_epochs: 0

  temporal_setting:
    temporal_mode: none

unet_resnet18:

  architecture:
    _target_: src.surgical_copilot.models.segmentation_smp.SMPUNet
    encoder_name: "resnet18"
    encoder_weights: "imagenet"
    use_imagenet_norm: True
    in_channels: 3
    classes: 1

  initialization:
    mode: imagenet
    checkpoint_path: null
    freeze_backbone: false
    warmup_epochs: 0

  temporal_setting:
    temporal_mode: none

## EARLY FUSION

### WARM-UP ON

unet_early_fusion_warmup_on:
  
  architecture:
    _target_: monai.networks.nets.UNet
    spatial_dims: 2
    in_channels: 4 # 3 RGB + 1 Maschera
    out_channels: 1
    channels: [32, 64, 128, 256, 512]
    strides: [2, 2, 2, 2]
    num_res_units: 2

  initialization:
    mode: checkpoint
    checkpoint_path: "/work/cvcs2026/DeepLook/results/weights/UNet/best_fold{fold_idx}.pth"
    freeze_backbone: false
    warmup_epochs: 5

  temporal_setting:
    temporal_mode: "early_fusion"
    temporal_target_layer: "model.0.conv.unit0.conv.weight"

unet_resnet18_early_fusion_warmup_on:
  architecture:
    _target_: src.surgical_copilot.models.segmentation_smp.SMPUNet
    encoder_name: "resnet18"
    encoder_weights: "imagenet"
    use_imagenet_norm: True
    in_channels: 4 # 3 RGB + 1 Maschera
    classes: 1

  initialization:
    mode: checkpoint
    checkpoint_path: "/work/cvcs2026/DeepLook/results/weights/SMPUNet/best_fold{fold_idx}.pth"
    freeze_backbone: true
    warmup_epochs: 5

  temporal_setting:
    temporal_mode: "early_fusion"
    temporal_target_layer: "model.0.conv.unit0.conv.weight" # Copia i pesi da 3 a 4 canali

### WARM-UP OFF

unet_early_fusion_warmup_off:
  
  architecture:
    _target_: monai.networks.nets.UNet
    spatial_dims: 2
    in_channels: 4 # 3 RGB + 1 Maschera
    out_channels: 1
    channels: [32, 64, 128, 256, 512]
    strides: [2, 2, 2, 2]
    num_res_units: 2

  temporal_setting:
    temporal_mode: "early_fusion"
    temporal_target_layer: null
  
  initialization:
    mode: scratch
    checkpoint_path: null
    freeze_backbone: false
    warmup_epochs: 0

unet_resnet18_early_fusion_warmup_off:
  architecture:
    _target_: src.surgical_copilot.models.segmentation_smp.SMPUNet
    encoder_name: "resnet18"
    encoder_weights: "imagenet"
    use_imagenet_norm: True
    in_channels: 4 # 3 RGB + 1 Maschera
    classes: 1

  temporal_setting:
    temporal_mode: "early_fusion"
    temporal_target_layer: null # Copia i pesi da 3 a 4 canali

  initialization:
    mode: scratch
    warmup_epochs: 0
    checkpoint_path: null
    freeze_backbone: false

## LATE FUSION

### WARMUP ON

r_unet_late_fusion_lstm_warmup_on:
  architecture:
    _target_: src.surgical_copilot.models.Recurrent_U_Net.runet.RecurrentUNet
    spatial_dims: 2
    in_channels: 3
    out_channels: 1
    channels: [32, 64, 128, 256, 512]
    strides: [2, 2, 2, 2]
    recurrent_type: "lstm"
    num_res_units: 2
    recurrent_layers: 1 

  initialization:
    mode: checkpoint
    checkpoint_path: "/work/cvcs2026/DeepLook/results/weights/UNet/best_fold{fold_idx}.pth"
    freeze_backbone: true
    warmup_epochs: 5

  temporal_setting:
    temporal_mode: "late_fusion"
    temporal_target_layer: null

