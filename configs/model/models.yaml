# Unet++

## BASELINE

unet_plus_plus:
  architecture:
    _target_: monai.networks.nets.BasicUNetPlusPlus
    out_channels: 1
    spatial_dims: 2         
    in_channels: 3
    features: [32, 64, 128, 256, 512, 32]
    deep_supervision: False
  
  initialization:
    mode: scratch
    checkpoint_path: null
    freeze_backbone: false
    warmup_epochs: 0

  temporal_setting:
    temporal_mode: none

unet_plus_plus_resnet18:
  architecture:
    _target_: src.surgical_copilot.models.segmentation_smp.SMPUNetPlusPlus
    encoder_name: "resnet18"
    encoder_weights: "imagenet"
    in_channels: 3
    classes: 1

  initialization:
    mode: imagenet
    checkpoint_path: null
    freeze_backbone: false
    warmup_epochs: 0

  temporal_setting:
    temporal_mode: none

# SWIN U-NET

## BASELINE

swin_unetr:
  architecture:
    _target_: monai.networks.nets.SwinUNETR
    img_size: [640, 480]
    in_channels: 3
    out_channels: 1
    feature_size: 48
    spatial_dims: 2 # generally SwinUNETR is used with 3D image. In this way we can manage 2D frame
    use_checkpoint: True

  initialization:
    mode: scratch
    checkpoint_path: null
    freeze_backbone: false
    warmup_epochs: 0

  temporal_setting:
    temporal_mode: none

## YOLO

## BASELINE

yolo_v8_seg:
  architecture:
    _target_: src.surgical_copilot.models.yolov8_seg.yolov8_seg_wrapper.CustomYOLOSemantic
    num_classes: 1
    num_masks: 32

  initialization:
    mode: scratch
    checkpoint_path: null
    freeze_backbone: false
    warmup_epochs: 0

  temporal_setting:
    temporal_mode: none

## EARLY FUSION

yolo_early_fusion_warmup_on:
  architecture:
    _target_: src.surgical_copilot.models.yolov8_seg.yolov8_seg_wrapper.CustomYOLOSemantic
    in_channels: 4 # 3 channels RGB + 1 mask t-1 channel
    num_classes: 1
    num_masks: 32
    pretrained_weights_path: "/work/cvcs2026/DeepLook/results/weights/CustomYOLOSemantic/best_fold{fold_idx}.pth"

  initialization:
    mode: checkpoint
    checkpoint_path: "/work/cvcs2026/DeepLook/results/weights/CustomYOLOSemantic/best_fold{fold_idx}.pth"
    freeze_backbone: true
    warmup_epochs: 5

  temporal_setting:
    temporal_mode: "early_fusion"
    temporal_target_layer: "yolo.backbone.stem.0.conv.weight"

yolo_early_fusion_warmup_off:
  architecture:
    _target_: src.surgical_copilot.models.yolov8_seg.yolov8_seg_wrapper.CustomYOLOSemantic
    in_channels: 4 # 3 channels RGB + 1 mask t-1 channel
    num_classes: 1
    num_masks: 32

  initialization:
    mode: scratch
    checkpoint_path: null
    freeze_backbone: false
    warmup_epochs: 0

  temporal_setting:
    temporal_mode: "early_fusion"
    temporal_target_layer: null

