      - 256
      - 512
      strides:
      - 2
      - 2
      - 2
      - 2
      recurrent_type: lstm
      num_res_units: 2
      freeze_backbone: true
      is_temporal: true
      temporal_mode: recurrent
      warmup_epochs: 5
      pretrained_weights_path: weights/Unet/best_fold0.pth
data:
  desc: null
  value:
    root_dir: data/raw
    cache_rate: 1.0
    img_size:
    - 640
    - 480
    n_folds: 5
trainer:
  desc: null
  value:
    trainer:
      max_epochs: 50
      accumulation_steps: 3
      eval_freq: 5
      save_checkpoint: true
      num_workers: 4
      batch_size: 4
      precision: 16-mixed
    optimizer:
      _target_: torch.optim.AdamW
      lr: 0.001
      weight_decay: 1.0e-05
    scaler:
      _target_: torch.cuda.amp.GradScaler
      enabled: true
    loss:
      _target_: monai.losses.DiceFocalLoss
      sigmoid: true
      gamma: 1.0
      lambda_dice: 0.5
      lambda_focal: 0.5
    early_stopping:
      patience: 5
      monitor: val_dice
      mode: max
