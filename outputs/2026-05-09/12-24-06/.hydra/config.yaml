model:
  unet:
    _target_: monai.networks.nets.UNet
    spatial_dims: 2
    in_channels: 3
    out_channels: 1
    channels:
    - 16
    - 32
    - 64
    - 128
    - 256
    strides:
    - 2
    - 2
    - 2
    - 2
    num_res_units: 2
  unet_plus_plus:
    _target_: monai.networks.nets.BasicUNetPlusPlus
    spatial_dims: 2
    in_channels: 3
    out_channels: 1
    features:
    - 32
    - 64
    - 128
    - 256
    - 512
  swin_unet:
    _target_: monai.networks.nets.swin_unetr
    img_size:
    - 512
    - 512
    in_channels: 3
    out_channels: 1
    feature_size: 24
    depths:
    - 2
    - 2
    - 2
    - 2
    num_heads:
    - 3
    - 6
    - 12
    - 24
    window_size: 7
data:
  root_dir: data/raw
  cache_rate: 1.0
  img_size:
  - 224
  - 224
trainer:
  trainer:
    max_epochs: 1
    save_checkpoint: true
    num_workers: 0
    batch_size: 1
    precision: 16-mixed
  optimizer:
    _target_: torch.optim.AdamW
    lr: 0.0001
    weight_decay: 1.0e-05
  scheduler:
    _target_: torch.optim.lr_scheduler.CosineAnnealingLR
    T_max: ${trainer.trainer.max_epochs}
    eta_min: 1.0e-06
  scaler: null
  loss:
    _target_: monai.losses.DiceCELoss
    sigmoid: true
    lambda_dice: 0.5
    lambda_ce: 0.5
  early_stopping:
    patience: 5
    monitor: val_dice
    mode: max
models_to_bench:
- unet
seed: 42
device: cpu
debug: false
logging:
  project: surgical-copilot
  wandb_enabled: false
